name: Build APK

on:
  push:
    branches: [master]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install bun
        run: |
          curl -fsSL https://bun.sh/install | bash
          echo "$HOME/.bun/bin" >> $GITHUB_PATH

      - name: Install pnpm
        run: npm install -g pnpm

      - name: Build web-ui
        working-directory: web-ui
        run: |
          bun install
          pnpm build

      - name: Generate signing key
        run: |
          cd app
          keytool -genkeypair -v -keystore app.key -alias rikkahub -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass rikkahub123 -keypass rikkahub123 \
            -dname "CN=RikkaHub Agent, OU=Dev, O=Dev, L=City, S=State, C=CN"

      - name: Configure signing (local.properties at repo root)
        run: |
          cat > local.properties <<'EOF'
          storeFile=app.key
          storePassword=rikkahub123
          keyAlias=rikkahub
          keyPassword=rikkahub123
          EOF

      - name: Build APK
        run: ./gradlew :app:assembleRelease --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: rikkahub-agent-apk
          path: |
            app/build/outputs/apk/release/*.apk
          retention-days: 30

      - name: Upload signing key (save it for future fixed-signature builds)
        uses: actions/upload-artifact@v4
        with:
          name: signing-key
          path: app/app.key
          retention-days: 7
